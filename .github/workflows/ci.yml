name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: georgel2489/age-design
  IMAGE_TAG: ${{ github.ref_name }}

# ─── TEMP: deploy pipeline paused ──────────────────────────────────────────
# Dev/staging servers are not yet provisioned. The `build-and-push` and
# `deploy` jobs below are gated with `if: false`; their original trigger
# conditions are preserved as YAML comments directly underneath. To
# re-enable, on each of those two jobs:
#   1. delete the `if: false` line
#   2. uncomment the `# if: …` line right below it
# PR jobs (`test`, `validate`) are unaffected and continue to run normally.
# ───────────────────────────────────────────────────────────────────────────

jobs:
  build-and-push:
    name: Build and Push Docker Image
    # TEMP: paused — see "deploy pipeline paused" note at top of file.
    if: false
    # if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Cleanup old builds
        run: |
          docker ps -a --filter "status=exited" -q | xargs -r docker rm || true
          docker images --filter "dangling=true" -q | xargs -r docker rmi || true

      - name: Build and push Docker image (Dev)
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          network: host
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image (Staging)
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          network: host
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy
    needs: build-and-push
    # TEMP: paused — see "deploy pipeline paused" note at top of file.
    if: false
    # if: needs.build-and-push.result == 'success'
    runs-on: self-hosted

    steps:
      - name: Deploy to dev server
        if: github.ref_type != 'tag'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            echo "🔄 Deploying to dev..."
            cd /home/azureuser/app
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker image pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker compose stop storybook
            docker compose rm -f storybook
            sleep 5
            docker compose up --remove-orphans --no-deps -d storybook

            echo "🧹 Cleaning up..."
            docker system prune -f

            echo "✅ Dev deployment completed successfully"

      - name: Deploy to staging server
        if: github.ref_type == 'tag'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_STAGING }}
          username: ${{ secrets.HOST_USER_STAGING }}
          key: ${{ secrets.SSH_PRIVATE_KEY_STAGING }}
          script: |
            set -euo pipefail

            echo "🔄 Deploying to staging..."
            cd /home/azureuser/app
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker image pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            docker compose stop storybook
            docker compose rm -f storybook
            sleep 10
            touch .env
            sed -i "/^STORYBOOK_IMAGE_TAG=/d" .env
            echo "STORYBOOK_IMAGE_TAG=${{ env.IMAGE_TAG }}" >> .env
            sleep 5
            docker compose --env-file .env up --remove-orphans --no-deps -d storybook

            echo "🧹 Cleaning up..."
            docker system prune -f

            echo "✅ Staging deployment completed successfully"

  test:
    name: Build (PR)
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup old builds
        run: |
          echo "🧹 Cleaning up old containers and images..."
          docker ps -a --filter "status=exited" -q | xargs -r docker rm || true
          docker images --filter "dangling=true" -q | xargs -r docker rmi || true
          docker builder prune -f --filter "until=24h" || true
          echo "✅ Cleanup complete"

      - name: Build Docker image
        timeout-minutes: 30
        run: |
          set -e
          echo "🔨 Building Docker image for PR #${{ github.event.pull_request.number }}..."

          # PERF: Removed --no-cache to leverage BuildKit cache mounts in Dockerfile
          # Cache persists on self-hosted runner between builds
          docker build \
            --progress=plain \
            -t ghcr.io/age/design-system:pr-${{ github.event.pull_request.number }} \
            .

          echo "✅ Build complete"
          docker images | grep "ghcr.io/age/design-system" || true

      - name: Cleanup after build
        if: always()
        run: |
          echo "🧹 Post-build cleanup..."
          docker builder prune -f || true
          echo "✅ Cleanup complete"

  validate:
    name: Validate (PR)
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build tokens
        run: yarn tokens.build

      - name: Token reference audit
        run: yarn tokens.audit

      - name: Build (Stencil)
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Audit scripts (smoke tests)
        # Validates the scripts/audit/* tooling itself before relying on its
        # output for the audit:all step below.
        run: yarn test:scripts

      - name: Audit all components (no browser)
        # Runs scripts/audit/run-all.mjs --all --no-browser across every
        # cor-* component. Surfaces blocker-level findings as a CI failure;
        # warnings + info are visible in the JSON report uploaded as an artifact.
        run: node scripts/audit/run-all.mjs --all --no-browser --out reports/audit-all.json
        continue-on-error: true

      - name: Regression check vs baseline
        # Re-runs run-all on the 3 canonical baseline components and asserts
        # critical/high findings match the snapshot in reports/regression-baseline.json.
        # Non-blocking initially; flip continue-on-error to false after one
        # sprint of clean runs.
        run: node scripts/audit/regression-check.mjs --json --baseline reports/regression-baseline.json > reports/regression-check.json
        continue-on-error: true

      - name: Measure prompt cost
        # Captures char/token sizes of every .claude/* + AGENTS.md prompt so PR
        # reviewers can see token-cost delta when AI prompts change.
        run: node scripts/audit/measure-prompt-cost.mjs --json --out reports/prompt-cost.json
        continue-on-error: true

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-artifacts
          path: |
            reports/audit-all.json
            reports/regression-check.json
            reports/prompt-cost.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Unit tests
        run: stencil test --spec --maxWorkers=2

      - name: Verify no stale generated files
        # Auto-generated files are tracked with `merge=ours` in .gitattributes;
        # this step is the canonical gate that proves the committed snapshots
        # match what the build produces. If this fails, the contributor must
        # run `yarn build` locally and commit the residual diff.
        run: |
          git diff --exit-code -- \
            src/components.d.ts \
            'src/components/*/readme.md' 'src/hidden/*/readme.md' \
            .storybook/custom-elements.json \
            tokens/generated/ \
          || (echo "::error::Generated files are stale. Run 'yarn build' locally and commit the diff." && exit 1)

      - name: Build Storybook
        run: yarn sp.build
