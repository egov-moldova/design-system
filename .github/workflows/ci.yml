name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: georgel2489/age-design
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Cleanup old builds
        run: |
          docker ps -a --filter "status=exited" -q | xargs -r docker rm || true
          docker images --filter "dangling=true" -q | xargs -r docker rmi || true

      - name: Build and push Docker image (Dev)
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          network: host
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image (Staging)
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          network: host
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy
    needs: build-and-push
    if: needs.build-and-push.result == 'success'
    runs-on: self-hosted

    steps:
      - name: Deploy to dev server
        if: github.ref_type != 'tag'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            echo "🔄 Deploying to dev..."
            cd /home/azureuser/app
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker image pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker compose stop storybook
            docker compose rm -f storybook
            sleep 5
            docker compose up --remove-orphans --no-deps -d storybook

            echo "🧹 Cleaning up..."
            docker system prune -f

            echo "✅ Dev deployment completed successfully"

      - name: Deploy to staging server
        if: github.ref_type == 'tag'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_STAGING }}
          username: ${{ secrets.HOST_USER_STAGING }}
          key: ${{ secrets.SSH_PRIVATE_KEY_STAGING }}
          script: |
            set -euo pipefail

            echo "🔄 Deploying to staging..."
            cd /home/azureuser/app
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker image pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            docker compose stop storybook
            docker compose rm -f storybook
            sleep 10
            touch .env
            sed -i "/^STORYBOOK_IMAGE_TAG=/d" .env
            echo "STORYBOOK_IMAGE_TAG=${{ env.IMAGE_TAG }}" >> .env
            sleep 5
            docker compose --env-file .env up --remove-orphans --no-deps -d storybook

            echo "🧹 Cleaning up..."
            docker system prune -f

            echo "✅ Staging deployment completed successfully"

  test:
    name: Build (PR)
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup old builds
        run: |
          echo "🧹 Cleaning up old containers and images..."
          docker ps -a --filter "status=exited" -q | xargs -r docker rm || true
          docker images --filter "dangling=true" -q | xargs -r docker rmi || true
          docker builder prune -f --filter "until=24h" || true
          echo "✅ Cleanup complete"

      - name: Build Docker image
        timeout-minutes: 30
        run: |
          set -e
          echo "🔨 Building Docker image for PR #${{ github.event.pull_request.number }}..."

          # PERF: Removed --no-cache to leverage BuildKit cache mounts in Dockerfile
          # Cache persists on self-hosted runner between builds
          docker build \
            --progress=plain \
            -t ghcr.io/age/design-system:pr-${{ github.event.pull_request.number }} \
            .

          echo "✅ Build complete"
          docker images | grep "ghcr.io/age/design-system" || true

      - name: Cleanup after build
        if: always()
        run: |
          echo "🧹 Post-build cleanup..."
          docker builder prune -f || true
          echo "✅ Cleanup complete"

