name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      - name: Run lint
        run: yarn lint

  typecheck:
    name: Typecheck
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      - name: Run typecheck
        run: yarn typecheck

  tokens-validate:
    name: Tokens validation
    needs: [lint, typecheck]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      - name: Build tokens
        run: yarn tokens.build

      - name: Lint hardcoded colors
        run: yarn lint.colors

      - name: Lint token naming
        run: yarn tokens.lint.all

      - name: Validate tokens
        run: yarn tokens.validate

      # `.storybook/custom-elements.json` is a build artifact, and
      # scripts/__tests__/storybook-manifest.spec.mjs checks it against the
      # component readmes. Without this step that spec fails on a missing file
      # rather than on a disagreement.
      - name: Build components
        run: yarn build

      - name: Run token script tests
        run: yarn test:scripts

  test:
    name: Test
    needs: [lint, typecheck]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      - name: Run test
        run: yarn test

  dependencies-security-audit:
    name: Dependencies security audit
    needs: [lint, typecheck]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      - name: Run dependencies security audit
        run: yarn npm audit --severity high --all --recursive

  build:
    name: Build
    needs: [test, dependencies-security-audit]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
