name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup project
        uses: ../actions/setup-node-deps

      - name: Run lint
        run: yarn lint

  typecheck:
    name: Typecheck
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup project
        uses: ../actions/setup-node-deps

      - name: Run typecheck
        run: yarn typecheck

  test:
    name: Test
    needs: [lint, typecheck]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup project
        uses: ../actions/setup-node-deps

      - name: Run test
        run: yarn test

  dependencies-security-audit:
    name: Dependencies security audit
    needs: [lint, typecheck]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup project
        uses: ../actions/setup-node-deps

      - name: Run dependencies security audit
        run: yarn npm audit --severity high

  build:
    name: Build
    needs: [test, dependencies-security-audit]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
            context: .
            push: false
            cache-from: type=gha
            cache-to: type=gha,mode=max
