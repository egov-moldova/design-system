name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      - name: Run lint
        run: yarn lint

      - name: Check AI docs against the repo
        run: yarn docs:check

  changelog:
    name: Changelog fragments
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # Full history: the breaking-change check reads every commit since the base branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      - name: Validate fragments
        run: yarn changelog.check

      # A commit marked breaking (`feat!:`, `BREAKING CHANGE:` footer) needs a
      # fragment with `breaking: true` in this PR: it carries the migration note.
      - name: Require a fragment for breaking changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: yarn changelog.check --base "origin/$BASE_REF"

  typecheck:
    name: Typecheck
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      - name: Run typecheck
        run: yarn typecheck

  tokens-validate:
    name: Tokens validation
    needs: [lint, typecheck]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      - name: Build tokens
        run: yarn tokens.build

      - name: Lint hardcoded colors
        run: yarn lint.colors

      - name: Lint token naming
        run: yarn tokens.lint.all

      - name: Validate tokens
        run: yarn tokens.validate

      # `.storybook/custom-elements.json` is a build artifact, and
      # scripts/__tests__/storybook-manifest.spec.mjs checks it against the
      # component readmes. Without this step that spec fails on a missing file
      # rather than on a disagreement.
      - name: Build
        run: yarn build

      # Generated files merge with `merge=ours` (.gitattributes), so a stale
      # copy merges silently; only regenerating it shows the difference. Same
      # check as .husky/pre-push, which a push can skip.
      - name: Verify generated files are committed
        run: |
          STALE=$(git status --porcelain -- 'src/components/*/readme.md' 'src/hidden/*/readme.md')
          if [ -n "$STALE" ]; then
            printf 'Generated files differ from the commit; run yarn build and commit them:\n%s\n' "$STALE"
            exit 1
          fi

      - name: Run token script tests
        run: yarn test:scripts

  test:
    name: Test
    needs: [lint, typecheck]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      - name: Run test
        run: yarn test

  dependencies-security-audit:
    name: Dependencies security audit
    needs: [lint, typecheck]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      - name: Run dependencies security audit
        run: yarn npm audit --severity high --all --recursive

  build:
    name: Build
    needs: [test, dependencies-security-audit, tokens-validate]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      # Before `yarn build`: Stencil empties dist/ and restores dist/mud/tokens/
      # from tokens/generated/*.css, which only tokens.build writes. Storybook's
      # preview-head.html links to the same files.
      - name: Build token CSS
        run: yarn tokens.build

      - name: Build Stencil components and tokens
        run: yarn build
        env:
          NODE_ENV: production

      - name: Build Storybook
        run: yarn sp.docker

      - name: Validate package
        run: yarn validate.package

  # Builds the Vue and Angular adapters, packs them with the core, installs the tarballs into
  # fixture apps outside the workspaces and drives each app in Chromium. See
  # scripts/adapters/consumer-fixture.mjs for the steps and what each one fails on.
  adapters:
    name: Adapters
    needs: [lint, typecheck]
    # Headroom, not a budget: the shared build is ~10 min, an Angular 20 fixture build measured
    # ~5 min on a loaded machine, and the runner caps every one of its steps at 600 s. Three
    # runs at that cap, plus the two adapter builds, still fit.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      # Nothing here pushes: the token is not left in .git/config for the fixture runs to read.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup project
        uses: ./.github/actions/setup-node-deps

      # Both fixtures pin the same @playwright/test. Read it from versions.json instead of
      # retyping it here, and fail when the rows disagree: one cache key cannot cover two.
      - name: Read the pinned Playwright version
        id: playwright
        run: |
          VERSION=$(node -e "
            const rows = ['vue', 'angular'].flatMap(name =>
              Object.values(JSON.parse(require('fs').readFileSync('packages/' + name + '/fixture/versions.json', 'utf8'))),
            );
            const pins = [...new Set(rows.map(row => row.devDependencies['@playwright/test']))];
            if (pins.length !== 1) { console.error('fixtures pin different Playwright versions: ' + pins); process.exit(1); }
            console.log(pins[0]);
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The runner installs Chromium for that pin into this directory (with --with-deps under CI,
      # which always re-runs the apt step; only the browser download is cached). Every run
      # restores it, and only a push to main saves it (same key), so a pull request can never
      # write a cache entry that a later run on main would restore.
      - name: Restore the Playwright browser
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Before `yarn build`, for the same reason as in the Build job.
      - name: Build token CSS
        run: yarn tokens.build

      # Also generates the React, Vue and Angular proxies (git-ignored).
      - name: Build Stencil components and tokens
        run: yarn build
        env:
          NODE_ENV: production

      - name: Build the Vue adapter
        run: yarn build.vue

      - name: Build the Angular adapter
        run: yarn build.angular

      - name: Consumer fixture, Vue
        run: node scripts/adapters/consumer-fixture.mjs vue

      - name: Consumer fixture, Angular 20 (zone.js)
        run: node scripts/adapters/consumer-fixture.mjs angular --framework-version 20

      - name: Consumer fixture, Angular 22 (zoneless)
        run: node scripts/adapters/consumer-fixture.mjs angular --framework-version 22

      - name: Save the Playwright browser
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # A failed run keeps its temp directory (the runner prints its path): the fixture copy, the
      # build output and Playwright's traces (`trace: retain-on-failure`, in `test-results/`).
      - name: Upload the failed fixture runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-fixtures
          path: |
            ${{ runner.temp }}/mud-fixture-*
            !${{ runner.temp }}/mud-fixture-*/**/node_modules/**
          if-no-files-found: ignore
          retention-days: 7
