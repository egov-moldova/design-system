name: Deploy Storybook to development

on:
  workflow_dispatch:
    inputs:
      component_version:
        description: 'Published @egov-moldova/mud version (use latest for the current stable release)'
        required: false
        default: 'latest'

permissions:
  contents: read

concurrency:
  group: storybook-development
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve published version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      component_version: ${{ steps.resolve.outputs.component_version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve npm version and source commit
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.component_version }}
        run: node .github/scripts/resolve-storybook-version.cjs "$REQUESTED_VERSION"

  deploy:
    name: Build image and deploy
    needs: resolve-version
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment:
      name: development
      url: https://mud.dev.egov.md
    env:
      REGISTRY: ${{ vars.HARBOR_REGISTRY }}
      IMAGE_REPOSITORY: ${{ vars.HARBOR_IMAGE_REPOSITORY }}
      COMPONENT_VERSION: ${{ needs.resolve-version.outputs.component_version }}
      SOURCE_SHA: ${{ needs.resolve-version.outputs.source_sha }}
      IMAGE_TAG: npm-${{ needs.resolve-version.outputs.component_version }}-sha-${{ needs.resolve-version.outputs.short_sha }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE }}
      CHART_PATH: deploy/design.system/chart
      VALUES_PATH: deploy/design.system/values.dev.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check out published component source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          path: component-source

      - name: Verify published component source
        shell: bash
        working-directory: component-source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cp ../.github/docker/storybook-versioned.Dockerfile Dockerfile.storybook-versioned

      - name: Validate deployment configuration
        shell: bash
        run: |
          : "${REGISTRY:?Set the HARBOR_REGISTRY variable on the development environment.}"
          : "${IMAGE_REPOSITORY:?Set the HARBOR_IMAGE_REPOSITORY variable on the development environment.}"
          : "${K8S_NAMESPACE:?Set the K8S_NAMESPACE variable on the development environment.}"
          : "${HELM_RELEASE:?Set the HELM_RELEASE variable on the development environment.}"

      - name: Log in to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Storybook image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: component-source
          file: component-source/Dockerfile.storybook-versioned
          build-args: |
            COMPONENT_VERSION=${{ env.COMPONENT_VERSION }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Set Kubernetes context
        uses: azure/k8s-set-context@ae59a723ba9abe7a9655538854a025448dbab4aa # v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DEV }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.6

      - name: Stamp and validate Helm chart
        shell: bash
        run: |
          sed -i "s/^appVersion:.*$/appVersion: \"${IMAGE_TAG}\"/" "${CHART_PATH}/Chart.yaml"
          helm lint "${CHART_PATH}" --values "${VALUES_PATH}"
          helm template "${HELM_RELEASE}" "${CHART_PATH}" \
            --namespace "${K8S_NAMESPACE}" \
            --values "${VALUES_PATH}" \
            --set-string "deployment.webui.image.repository=${REGISTRY}/${IMAGE_REPOSITORY}" \
            --set-string "deployment.webui.image.tag=${IMAGE_TAG}" >/dev/null

      - name: Deploy immutable image
        shell: bash
        run: |
          helm upgrade "${HELM_RELEASE}" "${CHART_PATH}" \
            --install \
            --atomic \
            --wait \
            --timeout 10m \
            --namespace "${K8S_NAMESPACE}" \
            --values "${VALUES_PATH}" \
            --set-string "deployment.webui.image.repository=${REGISTRY}/${IMAGE_REPOSITORY}" \
            --set-string "deployment.webui.image.tag=${IMAGE_TAG}"
          kubectl rollout status "deployment/${HELM_RELEASE}-mud-webui" \
            --namespace "${K8S_NAMESPACE}" \
            --timeout 5m

      - name: Point the dev image alias at the deployed image
        shell: bash
        run: >
          docker buildx imagetools create
          --tag "${REGISTRY}/${IMAGE_REPOSITORY}:dev"
          "${REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Summarize deployment
        shell: bash
        run: |
          {
            echo "Deployed image: \`${REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_TAG}\`"
            echo "Component version: \`@egov-moldova/mud@${COMPONENT_VERSION}\`"
            echo "Source commit: \`${SOURCE_SHA}\`"
            echo "Application: https://mud.dev.egov.md"
          } >> "$GITHUB_STEP_SUMMARY"
