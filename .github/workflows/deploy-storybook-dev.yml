name: Deploy Storybook to development

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Build image and deploy
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment:
      name: development
      url: https://mud.dev.egov.md
    env:
      REGISTRY: ${{ vars.HARBOR_REGISTRY }}
      IMAGE_REPOSITORY: ${{ vars.HARBOR_IMAGE_REPOSITORY }}
      IMAGE_TAG: sha-${{ github.sha }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE }}
      CHART_PATH: deploy/design.system/chart
      VALUES_PATH: deploy/design.system/values.dev.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          : "${REGISTRY:?Set the HARBOR_REGISTRY variable on the development environment.}"
          : "${IMAGE_REPOSITORY:?Set the HARBOR_IMAGE_REPOSITORY variable on the development environment.}"
          : "${K8S_NAMESPACE:?Set the K8S_NAMESPACE variable on the development environment.}"
          : "${HELM_RELEASE:?Set the HELM_RELEASE variable on the development environment.}"

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Storybook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set Kubernetes context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DEV }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Stamp and validate Helm chart
        shell: bash
        run: |
          sed -i "s/^appVersion:.*$/appVersion: \"${IMAGE_TAG}\"/" "${CHART_PATH}/Chart.yaml"
          helm lint "${CHART_PATH}" --values "${VALUES_PATH}"
          helm template "${HELM_RELEASE}" "${CHART_PATH}" \
            --namespace "${K8S_NAMESPACE}" \
            --values "${VALUES_PATH}" \
            --set-string "deployment.webui.image.repository=${REGISTRY}/${IMAGE_REPOSITORY}" \
            --set-string "deployment.webui.image.tag=${IMAGE_TAG}" >/dev/null

      - name: Deploy immutable image
        shell: bash
        run: |
          helm upgrade "${HELM_RELEASE}" "${CHART_PATH}" \
            --install \
            --atomic \
            --wait \
            --timeout 10m \
            --namespace "${K8S_NAMESPACE}" \
            --values "${VALUES_PATH}" \
            --set-string "deployment.webui.image.repository=${REGISTRY}/${IMAGE_REPOSITORY}" \
            --set-string "deployment.webui.image.tag=${IMAGE_TAG}"
          kubectl rollout status "deployment/${HELM_RELEASE}-mud-webui" \
            --namespace "${K8S_NAMESPACE}" \
            --timeout 5m

      - name: Point the dev image alias at the deployed image
        shell: bash
        run: >
          docker buildx imagetools create
          --tag "${REGISTRY}/${IMAGE_REPOSITORY}:dev"
          "${REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Summarize deployment
        shell: bash
        run: |
          {
            echo "Deployed image: \`${REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_TAG}\`"
            echo "Application: https://mud.dev.egov.md"
          } >> "$GITHUB_STEP_SUMMARY"
