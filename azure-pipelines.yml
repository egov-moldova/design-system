name: '1.0$(Rev:.r)'

trigger:
  branches:
    include:
      - main

pr: none

variables:
  vmImageName: 'ubuntu-latest'
  packageVersion: '$(Build.BuildNumber)'

stages:
- stage: Build
  displayName: Build and Publish
  jobs:
  - job: BuildJob
    displayName: Build and Publish Job
    pool:
      name: staging
    steps:
    - checkout: self
      persistCredentials: true

    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
      displayName: 'Install Node.js'

    - script: corepack enable
      displayName: 'Enable Corepack'

    - script: yarn install --immutable
      displayName: 'Install dependencies'

    - script: |
        echo "Setting version to $(packageVersion)"
        yarn version set $(packageVersion)
        cd web-components
        yarn version set $(packageVersion)
      displayName: 'Update Package Versions'

    - script: |
        yarn tokens.build
        yarn build
        yarn build.web
      displayName: 'Build All'
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"

    - script: yarn test.dev
      displayName: 'Run Tests'

    - script: |
        echo "Inspecting package metadata before publish..."
        echo "---- Root Package (@egov-moldova/mud) ----"
        cat package.json | grep -E '"name"|"version"'
        echo "---- Web Components (@egov-moldova/mud-web-components) ----"
        cat web-components/package.json | grep -E '"name"|"version"'
      displayName: 'Inspect Package Metadata'

    - script: |
        yarn npm publish --access public
      displayName: 'Publish Core Package (@egov-moldova/mud)'
      env:
        YARN_NPM_AUTH_TOKEN: $(token)

    - script: |
        cd web-components
        yarn npm publish --access public
      displayName: 'Publish Web Components (@egov-moldova/mud-web-components)'
      env:
        YARN_NPM_AUTH_TOKEN: $(token)

    - script: |
        git config --global user.email "azure-pipelines@dev.azure.com"
        git config --global user.name "Azure Pipelines"
        git tag -a "v$(packageVersion)" -m "Release v$(packageVersion) [skip ci]"
        git push origin "v$(packageVersion)"
      displayName: 'Create and Push Tag'
      condition: succeeded()
