name: '$(Date:yy).$(Date:MM).$(DayOfMonth)$(Rev:.r)'

trigger: none

variables:
  DOCKER_VERSION: '29.2.1'
  HELM_VERSION: '3.18.6'
  containerRegistry: harbor.staging.egov.md
  containerProject: mud
  containerTag: '1.$(Build.BuildNumber)'

  solutionPath: .
  webuiDockerfile: Dockerfile
  webuiContainerRepository: '$(containerProject)/mud-storybook'

stages:
  - stage: BuildContainer
    displayName: Build Containers
    pool:
      name: Azure Pipelines
      vmImage: ubuntu-latest
    jobs:
      - job: BuildContainers
        displayName: Build Containers
        workspace:
          clean: resources
        steps:
          - checkout: self

          - task: DockerInstaller@0
            displayName: Install Docker CLI
            inputs:
              dockerVersion: $(DOCKER_VERSION)

          - task: Docker@2
            displayName: Docker Login to Staging Registry
            inputs:
              containerRegistry: '$(containerRegistry)'
              command: 'login'

          - task: Docker@2
            displayName: Build WebUI Image
            inputs:
              command: build
              containerRegistry: $(containerRegistry)
              repository: $(webuiContainerRepository)
              tags: $(containerTag),latest
              dockerfile: $(webuiDockerfile)
              buildContext: $(solutionPath)
              arguments: --progress=plain
