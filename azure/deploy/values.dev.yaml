timeZone: Europe/Chisinau

imagePullSecrets:
- name: harbor-staging

deployment:
  webui:
    replicas: 1
    image:
      repository: harbor.staging.egov.md/mud/mud-storybook
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m
    networkPolicy:
      enabled: true

ingress:
  webui:
    host: mud.dev.egov.md
