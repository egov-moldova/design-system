{{- $fullName := include "app.fullname" . -}}
{{- range $workloadKey, $workload := .Values.deployment -}}
{{- if and (hasKey $workload "enabled" | ternary $workload.enabled true) $workload.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-%s" $fullName $workloadKey }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    {{- toYaml $workload.labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selector" $ | nindent 6 }}
      {{- toYaml $workload.labels | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- required "networkPolicy ingress rules are required" $workload.networkPolicy.ingress | toYaml | nindent 4 }}
---
{{- end }}
{{- end }}

