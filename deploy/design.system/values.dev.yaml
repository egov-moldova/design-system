imagePullSecrets:
  - name: harbor-staging

deployment:
  webui:
    replicas: 1
    image:
      repository: harbor.staging.egov.md/design/mud-storybook
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m
    networkPolicy:
      enabled: true
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  ns.kubernetes.io/name: nginx-ingress
              podSelector:
                matchLabels:
                  app.kubernetes.io/component: controller
          ports:
            - port: 6006
ingress:
  webui:
    host: mud.dev.egov.md
