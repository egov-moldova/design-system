server {
    listen       6006;
    server_name  localhost;
    gzip on;
    gzip_types application/xml application/javascript text/css;
    gzip_min_length 1000;

    location /health {
        return 200;
        access_log off;
    }

    location /assets/ {
        expires 7d;
        gzip_static on;
        root   /usr/share/nginx/html;
        try_files $uri =404;
    }

    location /tokens/ {
        expires 1d;
        gzip_static on;
        root   /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ~* \.entry\.js$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /iframe.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        expires 7d;
        gzip_static on;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri index.html /index.html;
    }

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
