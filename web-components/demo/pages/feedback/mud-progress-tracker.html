<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mud-progress-tracker · @age/web-components</title>
  </head>
  <body data-component="mud-progress-tracker">
    <main class="demo-main">
      <section id="mud-progress-tracker" class="component-section">
        <h2>&lt;mud-progress-tracker&gt;</h2>

        <div class="subsection">
          <h3>Horizontal — one of each status (steps set via JS property)</h3>
          <div style="width: 100%; max-width: 720px">
            <mud-progress-tracker id="demo-tracker-horizontal" orientation="horizontal"></mud-progress-tracker>
          </div>
        </div>

        <div class="subsection">
          <h3>Vertical — with supporting text</h3>
          <div style="width: 100%; max-width: 480px">
            <mud-progress-tracker id="demo-tracker-vertical" orientation="vertical"></mud-progress-tracker>
          </div>
        </div>

        <div class="subsection">
          <h3>Interactive (completed + current emit corStepClick)</h3>
          <div style="width: 100%; max-width: 720px">
            <mud-progress-tracker
              id="demo-tracker-interactive"
              orientation="horizontal"
              interactive=""
            ></mud-progress-tracker>
          </div>
        </div>

        <div class="subsection">
          <h3>Edge cases — 6+ steps and long labels</h3>
          <div style="width: 100%; max-width: 720px">
            <mud-progress-tracker id="demo-tracker-many" orientation="horizontal"></mud-progress-tracker>
          </div>
          <div style="width: 100%; max-width: 480px; margin-top: 24px">
            <mud-progress-tracker id="demo-tracker-longlabels" orientation="vertical"></mud-progress-tracker>
          </div>
        </div>
      </section>
      <script type="module">
        // mud-progress-tracker.steps is an ARRAY prop — must be assigned as a JS
        // property (Stencil cannot deserialize arrays from HTML attributes).
        customElements.whenDefined('mud-progress-tracker').then(() => {
          const horizontal = document.getElementById('demo-tracker-horizontal');
          if (horizontal) {
            horizontal.steps = [
              { label: 'Date personale', status: 'completed' },
              { label: 'Documente', status: 'current' },
              { label: 'Verificare', status: 'pending' },
              { label: 'Plată', status: 'error' },
            ];
          }

          const vertical = document.getElementById('demo-tracker-vertical');
          if (vertical) {
            vertical.steps = [
              { label: 'Cont creat', supportingText: 'Finalizat acum 3 zile', status: 'completed' },
              { label: 'Identitate', supportingText: 'În curs de verificare', status: 'current' },
              { label: 'Semnătură', supportingText: 'Necesită semnătură electronică', status: 'pending' },
              { label: 'Confirmare', supportingText: 'Ultimul pas', status: 'pending' },
            ];
          }

          const interactive = document.getElementById('demo-tracker-interactive');
          if (interactive) {
            interactive.steps = [
              { id: 's1', label: 'Pasul 1', status: 'completed' },
              { id: 's2', label: 'Pasul 2', status: 'completed' },
              { id: 's3', label: 'Pasul 3', status: 'current' },
              { id: 's4', label: 'Pasul 4', status: 'pending' },
            ];
            interactive.addEventListener('corStepClick', e => {
              console.log('corStepClick', e.detail.index, e.detail.step.label);
            });
          }

          const many = document.getElementById('demo-tracker-many');
          if (many) {
            many.steps = [
              { label: 'Unu', status: 'completed' },
              { label: 'Doi', status: 'completed' },
              { label: 'Trei', status: 'completed' },
              { label: 'Patru', status: 'current' },
              { label: 'Cinci', status: 'pending' },
              { label: 'Șase', status: 'pending' },
              { label: 'Șapte', status: 'pending' },
            ];
          }

          const longLabels = document.getElementById('demo-tracker-longlabels');
          if (longLabels) {
            longLabels.steps = [
              {
                label: 'Completarea formularului de cerere pentru eliberarea actului de identitate',
                supportingText: 'Toate câmpurile obligatorii trebuie completate cu diacritice ăâîșț',
                status: 'completed',
              },
              {
                label: 'Încărcareadocumentelorjustificativefărăspațiipentrutestareaîncadrării',
                supportingText: 'Format acceptat: PDF, JPG',
                status: 'current',
              },
              {
                label: 'Achitarea taxei de stat și confirmarea plății',
                status: 'pending',
              },
            ];
          }
        });
      </script>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
