<!doctype html>
<html lang="ro-MD">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mud-stepper · @egov-moldova/mud-web-components</title>
  </head>
  <body data-component="mud-stepper">
    <main class="demo-main">
      <section id="mud-stepper" class="component-section">
        <h2>&lt;mud-stepper&gt;</h2>

        <div class="subsection">
          <h3>Horizontal — one of each status (steps set via JS property)</h3>
          <div style="width: 100%; max-width: 720px">
            <mud-stepper id="demo-tracker-horizontal" orientation="horizontal"></mud-stepper>
          </div>
        </div>

        <div class="subsection">
          <h3>Vertical — with supporting text</h3>
          <div style="width: 100%; max-width: 480px">
            <mud-stepper id="demo-tracker-vertical" orientation="vertical"></mud-stepper>
          </div>
        </div>

        <div class="subsection">
          <h3>Interactive (completed + current emit corStepClick)</h3>
          <div style="width: 100%; max-width: 720px">
            <mud-stepper id="demo-tracker-interactive" orientation="horizontal" interactive=""></mud-stepper>
          </div>
        </div>

        <div class="subsection">
          <h3>Edge cases — 6+ steps and long labels</h3>
          <div style="width: 100%; max-width: 720px">
            <mud-stepper id="demo-tracker-many" orientation="horizontal"></mud-stepper>
          </div>
          <div style="width: 100%; max-width: 480px; margin-top: 24px">
            <mud-stepper id="demo-tracker-longlabels" orientation="vertical"></mud-stepper>
          </div>
        </div>
      </section>
      <script type="module">
        // mud-stepper.steps is an ARRAY prop — must be assigned as a JS
        // property (Stencil cannot deserialize arrays from HTML attributes).
        customElements.whenDefined('mud-stepper').then(() => {
          const horizontal = document.getElementById('demo-tracker-horizontal');
          if (horizontal) {
            horizontal.steps = [
              { label: 'Personal data', status: 'completed' },
              { label: 'Documents', status: 'current' },
              { label: 'Verification', status: 'pending' },
              { label: 'Payment', status: 'error' },
            ];
          }

          const vertical = document.getElementById('demo-tracker-vertical');
          if (vertical) {
            vertical.steps = [
              { label: 'Account created', supportingText: 'Completed 3 days ago', status: 'completed' },
              { label: 'Identity', supportingText: 'Under review', status: 'current' },
              { label: 'Signature', supportingText: 'Requires an electronic signature', status: 'pending' },
              { label: 'Confirmation', supportingText: 'Last step', status: 'pending' },
            ];
          }

          const interactive = document.getElementById('demo-tracker-interactive');
          if (interactive) {
            interactive.steps = [
              { id: 's1', label: 'Pasul 1', status: 'completed' },
              { id: 's2', label: 'Pasul 2', status: 'completed' },
              { id: 's3', label: 'Pasul 3', status: 'current' },
              { id: 's4', label: 'Pasul 4', status: 'pending' },
            ];
            interactive.addEventListener('corStepClick', e => {
              console.log('corStepClick', e.detail.index, e.detail.step.label);
            });
          }

          const many = document.getElementById('demo-tracker-many');
          if (many) {
            many.steps = [
              { label: 'Unu', status: 'completed' },
              { label: 'Doi', status: 'completed' },
              { label: 'Three', status: 'completed' },
              { label: 'Four', status: 'current' },
              { label: 'Five', status: 'pending' },
              { label: 'Six', status: 'pending' },
              { label: 'Seven', status: 'pending' },
            ];
          }

          const longLabels = document.getElementById('demo-tracker-longlabels');
          if (longLabels) {
            longLabels.steps = [
              {
                label: 'Filling in the request form for issuing the identity document',
                supportingText: 'All required fields must be filled in, including accented characters éüñ',
                status: 'completed',
              },
              {
                label: 'Uploadingthesupportingdocumentswithoutspacesfortestingthefit',
                supportingText: 'Accepted format: PDF, JPG',
                status: 'current',
              },
              {
                label: 'Paying the state fee and confirming the payment',
                status: 'pending',
              },
            ];
          }
        });
      </script>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
