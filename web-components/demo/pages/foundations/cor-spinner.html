<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cor-spinner · @age/web-components</title>
  </head>
  <body data-component="cor-spinner">
    <main class="demo-main">
      <section id="cor-spinner" class="component-section">
        <h2>&lt;cor-spinner&gt;</h2>

        <div class="subsection">
          <h3>Sizes (variant brand)</h3>
          <div class="row">
            <div class="cell">
              <cor-spinner size="xs" variant="brand"></cor-spinner>
              <span class="label">xs</span>
            </div>
            <div class="cell">
              <cor-spinner size="sm" variant="brand"></cor-spinner>
              <span class="label">sm</span>
            </div>
            <div class="cell">
              <cor-spinner size="md" variant="brand"></cor-spinner>
              <span class="label">md</span>
            </div>
            <div class="cell">
              <cor-spinner size="lg" variant="brand"></cor-spinner>
              <span class="label">lg</span>
            </div>
          </div>
        </div>

        <div class="subsection">
          <h3>Variants (size md)</h3>
          <div class="row">
            <div class="cell">
              <div class="swatch"><cor-spinner size="md" variant="brand"></cor-spinner></div>
              <span class="label">brand</span>
            </div>
            <div class="cell">
              <div class="swatch"><cor-spinner size="md" variant="dark"></cor-spinner></div>
              <span class="label">dark</span>
            </div>
            <div class="cell">
              <div class="swatch on-dark"><cor-spinner size="md" variant="light"></cor-spinner></div>
              <span class="label">light</span>
            </div>
            <div class="cell">
              <div class="swatch on-brand"><cor-spinner size="md" variant="light-on-color"></cor-spinner></div>
              <span class="label">light-on-color</span>
            </div>
          </div>
        </div>

        <div class="subsection">
          <h3>All variants × sizes</h3>
          <div class="grid">
            <div></div>
            <div class="label">xs</div>
            <div class="label">sm</div>
            <div class="label">md</div>
            <div class="label">lg</div>

            <div class="row-label">brand</div>
            <div class="swatch"><cor-spinner size="xs" variant="brand"></cor-spinner></div>
            <div class="swatch"><cor-spinner size="sm" variant="brand"></cor-spinner></div>
            <div class="swatch"><cor-spinner size="md" variant="brand"></cor-spinner></div>
            <div class="swatch"><cor-spinner size="lg" variant="brand"></cor-spinner></div>

            <div class="row-label">dark</div>
            <div class="swatch"><cor-spinner size="xs" variant="dark"></cor-spinner></div>
            <div class="swatch"><cor-spinner size="sm" variant="dark"></cor-spinner></div>
            <div class="swatch"><cor-spinner size="md" variant="dark"></cor-spinner></div>
            <div class="swatch"><cor-spinner size="lg" variant="dark"></cor-spinner></div>

            <div class="row-label">light</div>
            <div class="swatch on-dark"><cor-spinner size="xs" variant="light"></cor-spinner></div>
            <div class="swatch on-dark"><cor-spinner size="sm" variant="light"></cor-spinner></div>
            <div class="swatch on-dark"><cor-spinner size="md" variant="light"></cor-spinner></div>
            <div class="swatch on-dark"><cor-spinner size="lg" variant="light"></cor-spinner></div>

            <div class="row-label">light-on-color</div>
            <div class="swatch on-brand"><cor-spinner size="xs" variant="light-on-color"></cor-spinner></div>
            <div class="swatch on-brand"><cor-spinner size="sm" variant="light-on-color"></cor-spinner></div>
            <div class="swatch on-brand"><cor-spinner size="md" variant="light-on-color"></cor-spinner></div>
            <div class="swatch on-brand"><cor-spinner size="lg" variant="light-on-color"></cor-spinner></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
