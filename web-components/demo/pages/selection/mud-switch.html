<!doctype html>
<html lang="ro-MD">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mud-switch · @egov-moldova/mud-web-components</title>
  </head>
  <body data-component="mud-switch">
    <main class="demo-main">
      <section id="mud-switch" class="component-section">
        <h2>&lt;mud-switch&gt;</h2>

        <div class="subsection">
          <h3>States</h3>
          <div class="row">
            <div class="cell">
              <div style="width: 100%; max-width: 360px">
                <mud-switch label="Push notifications"></mud-switch>
              </div>
              <span class="label">off</span>
            </div>
            <div class="cell">
              <div style="width: 100%; max-width: 360px">
                <mud-switch checked="" label="Push notifications"></mud-switch>
              </div>
              <span class="label">on</span>
            </div>
            <div class="cell">
              <div style="width: 100%; max-width: 360px">
                <mud-switch disabled="" label="Unavailable"></mud-switch>
              </div>
              <span class="label">disabled (off)</span>
            </div>
            <div class="cell">
              <div style="width: 100%; max-width: 360px">
                <mud-switch checked="" disabled="" label="On and locked"></mud-switch>
              </div>
              <span class="label">disabled (on)</span>
            </div>
            <div class="cell">
              <div style="width: 100%; max-width: 360px">
                <mud-switch checked="" required="" name="autosave" value="enabled" label="Autosave"></mud-switch>
              </div>
              <span class="label">required + value</span>
            </div>
          </div>
        </div>

        <div class="subsection">
          <h3>Slot + edge cases</h3>
          <div class="row">
            <div class="cell">
              <div style="width: 100%; max-width: 360px">
                <mud-switch checked="">
                  <span slot="label">Dark mode</span>
                </mud-switch>
              </div>
              <span class="label">label slot</span>
            </div>
            <div class="cell">
              <div style="width: 100%; max-width: 360px">
                <mud-switch
                  checked=""
                  label="Enable two-step SMS authentication for all new sessions from unknown devices"
                ></mud-switch>
              </div>
              <span class="label">long wrapping label</span>
            </div>
            <div class="cell">
              <div style="width: 100%; max-width: 360px">
                <mud-switch label="Accented éüñ &amp; <b> 🔔"></mud-switch>
              </div>
              <span class="label">diacritics + special chars</span>
            </div>
            <div class="cell">
              <div style="width: 100%; max-width: 360px" dir="rtl">
                <mud-switch checked="" label="مرحبا بكم"></mud-switch>
              </div>
              <span class="label">RTL label</span>
            </div>
            <div class="cell">
              <div style="width: 100%; max-width: 360px">
                <mud-switch checked="" aria-label="Toggle without visible label"></mud-switch>
              </div>
              <span class="label">no label (aria-label only)</span>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
